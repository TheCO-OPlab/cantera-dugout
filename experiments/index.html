<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cantera experiments</title>
<style>
:root{--bg:#0e1411;--card:#151e19;--line:#2a3830;--ink:#e7eee8;--ink2:#b3c1b6;--muted:#7f9086;--pitch:#57b479}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:.02em}
.sub{color:var(--ink2);margin:0 0 24px}
.exp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.exp .meta{font:500 13px ui-monospace,Consolas,monospace;color:var(--muted)}
.exp h2{font-size:19px;margin:4px 0 6px}
.exp p{margin:0 0 10px;color:var(--ink2)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-block;background:var(--pitch);color:#08130c;font-weight:600;text-decoration:none;border-radius:6px;padding:8px 14px}
.links a.alt{background:none;color:var(--pitch);border:1px solid var(--pitch)}
footer{color:var(--muted);font-size:13px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cantera experiments</h1>
  <p class="sub">Builds from overnight runs, newest first. These are experiments, not releases: each one is frozen as it was at the end of its run.</p>
  <div id="list"></div>
  <footer>Anonymous play data is collected to improve the game; each build is tagged with its own label.</footer>
</div>
<script>
/* Add a new night's build at the top of this list. Nothing else needs editing. */
var EXPERIMENTS = [
  {
    date: '2026-10-07',
    title: 'The simulation night: the match plays on its own and stops at real chances',
    folder: 'kmtree6-b5',
    label: 'matchcore-kmtree6-b5',
    about: 'The match now plays continuously in a simulated world whose movement is fitted to real tracking data. It stops only at real chances, the menus come from where the men stand, and the result then plays out on the pitch. You get about 11 decisions a match (a16 had about 20), and about 3 to 4 of them are defending (a16 had about 8). Known problems: the header moments at the over-the-top ball and the cross moments can look different from the words on the card. Play at 2X. Movement fitted to real tracking data: Bassek, Rein, Weber, Memmert (2025), Scientific Data 12, 195; data DFL; CC BY 4.0.',
    links: [
      ['Play the match', 'play.html'],
      ['Play the cup', 'play.html?cup']
    ]
  },
  {
    date: '2026-10-06',
    title: 'The 7-match Cup: group, knockouts, overtime and shoot-outs',
    folder: 'kmtree5-a12',
    label: 'matchcore-kmtree5-a12',
    about: 'a9 with a full Cup: three group matches (top two go through), then the round of 16, quarter-final, semi-final and the final against Argentina, with an offer after every match. A drawn knockout goes to overtime, then a shoot-out. The trait cards now do what they say, defending cards give the outcomes they describe, and a careful player gets through each knockout before the final about nine times in ten. Cards that cannot be played are hidden, the page wording and end screen are rewritten, and substitutions are gone.',
    links: [
      ['Play the cup', 'play.html?cup'],
      ['Play the cup on d20', 'play.html?cup&dice=d20']
    ]
  },
  {
    date: '2026-10-02',
    title: 'Movement: one ball, chips that keep up at 2X, no waiting on the ball',
    folder: 'kmtree5-a9',
    label: 'matchcore-kmtree5-a9',
    about: 'a4 with the picture reworked from your notes and your screen recording. The page draws one ball, the same one the checks measure. At 2X the chips move at match speed, so a running man arrives with the ball. A kick, a header or a tackle happens with the man at the ball, and a ball in the air flies like a ball. When a card needs a far man, he starts nearer, the man on the ball turns with it and his defender stays on him until it is played. A kick-off is a tap and a pass, not a header in open ground. On the phone the dice box keeps off the men the result is about. The name tag, the caption and the grey chip change when the thing happens. The dice box takes its sentence from the result. No menu, dice roll or result changes, except that the overlap card is not offered to the man who already has the ball. Not in this build: defenders marking attackers.',
    links: [
      ['Play the cup', 'play.html?cup'],
      ['Play the cup on d20', 'play.html?cup&dice=d20'],
      ['Smaller chips on the phone (fewer chips on top of each other)', 'play.html?cup&chips=small'],
      ['The old picture, to compare (a4\'s movement)', 'play.html?cup&move=a5']
    ]
  },
  {
    date: '2026-10-01',
    title: 'Your a3 playtest notes: cleaner menus, a tap-able glossary, real ball speed',
    folder: 'kmtree5-a4',
    label: 'matchcore-kmtree5-a4',
    about: 'a3 with your playtest notes. The menu no longer offers two passes to the same man or a card another one beats on every count. Slalom is two take-ons at +2. The nearest midfielder carries the ball, so Olmo plays. The touchline free kick gets set-piece cards. Every term has a tap or hover definition, every greyed card says why, and pips show the decisions left. The ball flies at a ball\'s speed and the men stay in the play.',
    links: [
      ['Play the cup', 'play.html?cup'],
      ['Play the cup on d20', 'play.html?cup&dice=d20'],
      ['a3\'s gameplay with a4\'s screen (gameplay changes off)', 'play.html?cup&gaction=a3']
    ]
  },
  {
    date: '2026-09-30',
    title: 'Your notes on a2: six cards, shorter pauses',
    folder: 'kmtree5-a3',
    label: 'matchcore-kmtree5-a3',
    about: 'a2 with your notes. A real cut-back (a run to the goal line, then a pass back). A through ball. Two long shots, from midfield and from the edge of the box, each drawn at the distance it states. The keeper\'s short pass is safer and gets riskier the harder they press. The short free kick goes to a good passer 7 m away. "A pass backwards is easier" applies only when the pass goes back. Shorter pauses after results, and the result box stays clear of the play.',
    links: [
      ['Play the cup', 'play.html?cup'],
      ['The same with the six cards off (a2\'s cards)', 'play.html?cup&caction=a2'],
      ['Through ball with a2\'s rule', 'play.html?cup&throughgate=a2']
    ]
  },
  {
    date: '2026-09-30',
    title: 'Words that match the pitch, movement that looks like football',
    folder: 'kmtree5-a2',
    label: 'matchcore-kmtree5-a2',
    about: 'a1 with no new rules. Every card, result and commentator line now describes the pass or run the pitch actually shows, with the distance in brackets, in plain English. Nobody runs faster than a footballer, and nobody stops and then sprints between pictures. The safe pass now goes to a nearby man (your ruling). Matches take about 30 seconds longer.',
    links: [
      ['Play the cup', 'play.html?cup'],
      ['Play the cup on d20', 'play.html?cup&dice=d20']
    ]
  },
  {
    date: '2026-09-29',
    title: 'Build archetypes and opponent effects',
    folder: 'kmtree5-a1',
    label: 'matchcore-kmtree5-a1',
    about: 'Your five archetypes (Belief, Build-up, Pockets, The season, Understudies: 29 pieces) and 12 opponent effects, in a four-match cup. After each win pick one of three: a piece, a plain upgrade, or a new player for your bench. The team sheet has roster order and the opponent\'s effect with how to play around it. Win the cup and you can keep going. Settings has a d6 / d20 switch.',
    links: [
      ['Play the cup', 'play.html?cup'],
      ['Play the cup on d20', 'play.html?cup&dice=d20'],
      ['Build-up on Finishing only', 'play.html?cup&buildup=finishing']
    ]
  },
  {
    date: '2026-09-29',
    title: 'The cup: pick one of three after every win',
    folder: 'kmtree4-st4',
    label: 'matchcore-kmtree4-st4',
    about: 'Spain start plain. Five matches, the final against Argentina. After each win you pick one of three upgrades, with no hint about which ones go together: spotting that is the test. A draw ends the run (there are no penalties yet); the second link lets a draw go through. Also new: Rodri can pull a man down on purpose (the tactical foul), and a rattled defender is marked on the pitch and on every card that goes at him.',
    links: [
      ['Play the cup', 'play.html?cup'],
      ['Play the cup (a draw goes through)', 'play.html?cup&cupdraw=through'],
      ['Choose a build', 'play.html?builds']
    ]
  },
  {
    date: '2026-09-28',
    title: 'The starter set: nine pieces, four tactical questions',
    folder: 'kmtree4-st3',
    label: 'matchcore-kmtree4-st3',
    about: 'The first designed set of build pieces, in four families: where is their attention (a decoy and the man who takes his pass), what have they seen (every defence now remembers each attacker\'s last kind of move; vary it), who do we go after (rattle a defender, then keep at him), and how deep do we defend. Pick a Starter build at the top of the Builds screen. Known issues: a few cards are too automatic (the rattled man\'s pass across the goal, the decoy\'s redirect), and playing an attack for show rarely pays.',
    links: [
      ['Choose a Starter build', 'play.html?builds'],
      ['Starter mix', 'play.html?build=starter-mix'],
      ['Starter A: where is their attention?', 'play.html?build=starter-a-attention'],
      ['Starter C: who do we go after?', 'play.html?build=starter-c-target']
    ]
  },
  {
    date: '2026-09-27',
    title: 'Players move like footballers, and you can learn a build one piece at a time',
    folder: 'kmtree4-m8',
    label: 'matchcore-kmtree4-m8',
    about: 'Everything in m6, plus two things. The movement: the keeper goes toward the shot and dives only as far as the words say, the back line moves together, nobody runs for the restart while the ball is live. Three ways to play a build on the Builds screen: the full build, a guided match that points at each piece the first time it matters, or a build journey that adds one piece a match with a short review after each. The matches themselves are unchanged.',
    links: [
      ['Journey: Tire them, then beat the keeper', 'play.html?build=c-mix&bx=journey'],
      ['Guided: The false nine decoy', 'play.html?build=false-nine-decoy&bx=guided'],
      ['Choose a build', 'play.html?builds'],
      ['No build', 'play.html']
    ]
  },
  {
    date: '2026-09-26',
    title: 'Risky starred cards stay playable',
    folder: 'kmtree3-m6',
    label: 'matchcore-kmtree3-m6',
    about: 'Everything in m5, plus: a starred card (a move one of your players unlocks) is no longer greyed out because it is risky. It stays playable and says how often it goes wrong. Cards are still greyed when they truly cannot work. This build also records which build you loaded.',
    links: [
      ['Choose a build', 'play.html?builds'],
      ['Defend deep, break fast', 'play.html?build=deep-break'],
      ['No build', 'play.html']
    ]
  },
  {
    date: '2026-09-26',
    title: 'Build cards get their own place, and play between the moments',
    folder: 'kmtree3-m5',
    label: 'matchcore-kmtree3-m5',
    about: 'The same 36 builds, with your two rulings: a card your build creates gets its own extra place on the menu and arrives with a short flourish and sound, and build pieces now also act between the moments, with no cap. Defend deep, break fast and Tire them, then beat the keeper got much stronger. Known gap: the pitch does not yet act out what happens between the moments.',
    links: [
      ['Choose a build', 'play.html?builds'],
      ['The layoff engine', 'play.html?build=layoff-engine'],
      ['Defend deep, break fast', 'play.html?build=deep-break']
    ]
  },
  {
    date: '2026-09-26',
    title: 'Builds on the key-moments match',
    folder: 'kmtree3-m4',
    label: 'matchcore-kmtree3-m4',
    about: 'Spain against Argentina with 36 builds: pieces (traits, tactics, a captain, links, shared states) that combine and change what you should pick. 31 were designed and 5 emerged from simulations. Start with Defend deep, break fast.',
    links: [
      ['Choose a build', 'play.html?builds'],
      ['Defend deep, break fast', 'play.html?build=deep-break'],
      ['No build', 'play.html']
    ]
  }
];
var list = document.getElementById('list');
EXPERIMENTS.forEach(function (e) {
  var d = document.createElement('div'); d.className = 'exp';
  var links = e.links.map(function (l, i) {
    return '<a' + (i ? ' class="alt"' : '') + ' href="' + e.folder + '/' + l[1] + '">' + l[0] + '</a>';
  }).join('');
  d.innerHTML = '<div class="meta">' + e.date + ' · ' + e.folder + '</div><h2>' + e.title + '</h2><p>' + e.about + '</p><div class="links">' + links + '</div>';
  list.appendChild(d);
});
</script>
</body>
</html>
